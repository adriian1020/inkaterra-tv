# CI de la app de TV: formato, lint, pruebas y APK de depuración en cada PR.
name: App de TV

on:
  pull_request:
    paths:
      - "apps/tv/**"
      - ".github/workflows/tv.yml"
  push:
    branches: [main]
    paths:
      - "apps/tv/**"
      - ".github/workflows/tv.yml"

concurrency:
  group: tv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/tv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew ktlintCheck lintDebug testDebugUnitTest assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: apk-tv
          path: apps/tv/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
